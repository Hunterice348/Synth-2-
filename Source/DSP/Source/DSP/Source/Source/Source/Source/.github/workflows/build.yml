name: Build HUNTERICE ABYSS VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: |
          cmake --build build --config Release --target HUNTERICE_ABYSS_VST3 --parallel

      - name: Locate VST3
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Filter "*.vst3" | ForEach-Object { $_.FullName }
          $vst3 = Get-ChildItem -Path build -Recurse -Filter "*.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "VST3 not found" }
          echo "VST3_PATH=$($vst3.FullName)" >> $env:GITHUB_ENV

      - name: Package ZIP
        shell: pwsh
        run: |
          $src = $env:VST3_PATH
          $dst = "HUNTERICE_ABYSS_vst3.zip"
          Compress-Archive -Path $src -DestinationPath $dst -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HUNTERICE_ABYSS_VST3
          path: HUNTERICE_ABYSS_vst3.zip
